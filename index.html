<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctuary Malam — Ramai Sepi Bersama ✨🌙</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Kanvas Utama: Bintang Berkedip, Rasi Bintang, Kunang-Kunang Canvas & Bintang Jatuh -->
    <canvas id="canvas-semesta"></canvas>

    <!-- Lapisan Atmosfer Langit Malam, Aurora & Kabut Bergerak -->
    <div class="langit-malam"></div>
    <div class="aurora-layer"></div>
    <div class="aurora-layer-kedua"></div>
    <div class="kabut-malam"></div>

    <!-- Pemutar Musik Utama -->
    <audio id="lagu-utama" preload="auto" loop>
        <source src="lagu1.mp3" type="audio/mpeg">
    </audio>

    <!-- Tombol Kontrol Mengambang -->
    <button id="btn-audio-toggle" class="btn-kontrol-mengambang tersembunyi" title="Kontrol Musik">
        <span id="ikon-audio">🔊</span> <span id="status-audio-teks">Musik Menyala</span>
    </button>

    <button id="btn-ulang-semua" class="btn-ulang-pojok tersembunyi" title="Kembali ke Awal">
        ✨ Ulangi Perjalanan
    </button>

    <!-- =====================================================================
         BABAK 1: PROLOG AMPLOP 3D TILT & SAPAAN NAMA
         ===================================================================== -->
    <section id="babak-pembuka" class="layar-babak aktif">
        <div class="wadah-pembuka-animasi" id="tilt-container">
            <div class="cahaya-belakang-amplop"></div>
            <div class="kartu-amplop-3d" id="amplop-interaktif">
                <div class="segel-lilin">
                    <span>✨</span>
                </div>
                <span class="subjudul-kecil">UNDANGAN MALAM INI</span>
                <h2>Sebuah Ruang Tenang Untukmu</h2>
                <p>Sebelum melangkah masuk, tuliskan nama panggilanmu agar semesta malam ini bisa menyapamu dengan hangat.</p>
                
                <div class="grup-input-nama">
                    <input type="text" id="input-nama-user" placeholder="Ketik namamu di sini..." maxlength="24" autocomplete="off">
                </div>

                <button id="btn-buka-surat" class="btn-buka-surat">
                    Buka Ruang Tenang ✨
                </button>
            </div>
        </div>
    </section>

    <!-- =====================================================================
         BABAK 2: 5 KARTU REFLEKSI & PELEPASAN BEBAN
         ===================================================================== -->
    <section id="babak-motivasi" class="layar-babak tersembunyi">
        <div class="container-kartu-motivasi">
            <div class="header-motivasi">
                <span class="badge-babak" id="sapaan-personal">✨ UNTUKMU MALAM INI ✨</span>
                <div class="indikator-progres" id="indikator-progres"></div>
            </div>

            <div class="kartu-kaca-animasi" id="kartu-aktif">
                <div class="nomor-kutipan" id="nomor-kutipan">01 / 05</div>
                <h2 class="judul-kutipan" id="judul-kutipan">Kamu Sudah Berjuang Hebat</h2>
                
                <div class="wadah-teks-kutipan">
                    <p class="isi-kutipan" id="isi-kutipan"></p>
                </div>

                <!-- Fitur Interaktif 1: Simpan Lentera Beban -->
                <div id="fitur-lentera" class="area-interaktif-kartu tersembunyi">
                    <div class="grup-input-lentera">
                        <input type="text" id="input-beban" placeholder="Tulis satu hal yang bikin capek hari ini..." maxlength="55" autocomplete="off">
                        <button id="btn-simpan-lentera" class="btn-sekunder">Simpan ke Lentera 🏮</button>
                    </div>
                    <p id="status-lentera" class="teks-petunjuk-kecil"></p>
                    <div id="daftar-lentera-mini" class="daftar-chip-beban"></div>
                </div>

                <!-- Fitur Interaktif 2: Pemandu Napas 4-4-4 -->
                <div id="fitur-napas" class="area-interaktif-kartu tersembunyi">
                    <div class="wadah-lingkaran-napas">
                        <div class="cincin-luar-napas"></div>
                        <div class="lingkaran-napas" id="lingkaran-napas">
                            <span id="teks-napas">Siap?</span>
                        </div>
                    </div>
                    <button id="btn-mulai-napas" class="btn-sekunder">Mulai Relaksasi Napas 🌬️</button>
                </div>

                <div class="hiasan-garis"></div>
            </div>

            <div class="navigasi-motivasi">
                <button id="btn-sebelumnya-motivasi" class="btn-kembali tersembunyi">
                    ← Sebelumnya
                </button>
                <button id="btn-lanjut-motivasi" class="btn-utama">
                    Lanjut Membaca ➔
                </button>
                <button id="btn-menuju-ending" class="btn-spesial tersembunyi">
                    Masuk ke Ruang Tenang ✨
                </button>
            </div>
        </div>
    </section>

    <!-- =====================================================================
         BABAK 3: SANCTUARY MALAM, AYUNAN, LENTERA TERBANG & TAMAN CAHAYA
         ===================================================================== -->
    <section id="babak-ending" class="layar-babak tersembunyi">
        <!-- Bulan Purnama Interaktif -->
        <div class="bulan-purnama" id="bulan-interaktif" title="Klik Bulan untuk Hujan Bintang Jatuh">
            <div class="halo-bulan"></div>
            <div class="kawah-bulan k1"></div>
            <div class="kawah-bulan k2"></div>
            <div class="kawah-bulan k3"></div>
            <div class="kawah-bulan k4"></div>
        </div>

        <!-- Wadah Lentera Beban yang Dilepaskan ke Langit -->
        <div id="langit-lentera"></div>

        <!-- Wadah Kunang-Kunang DOM Tambahan -->
        <div id="wadah-kunang"></div>

        <!-- Siluet Pegunungan Berlapis -->
        <div class="pemandangan-gunung">
            <svg class="svg-gunung" viewBox="0 0 1440 420" preserveAspectRatio="none">
                <path d="M0 360 L180 190 L380 280 L620 120 L890 250 L1150 150 L1440 270 L1440 420 L0 420 Z" fill="#050d24" opacity="0.75"/>
                <path d="M0 390 L240 240 L510 340 L820 170 L1100 310 L1440 210 L1440 420 L0 420 Z" fill="#020718" opacity="0.9"/>
                <path d="M0 405 L160 310 L460 375 L760 260 L1080 360 L1440 290 L1440 420 L0 420 Z" fill="#01040f"/>
            </svg>
        </div>

        <!-- Wadah Lirik Sinkron di Atas -->
        <div id="lirik-container">
            <div class="bingkai-lirik">
                <span class="bintang-lirik">✦</span>
                <p id="teks-lirik">Menikmati tenang malam...</p>
                <span class="bintang-lirik">✦</span>
            </div>
        </div>

        <!-- Panggung Dahan Pohon & Ayunan dengan Siluet Orang -->
        <div class="panggung-ayunan-samping">
            <svg class="svg-ayunan-samping" viewBox="0 0 420 420">
                <defs>
                    <filter id="glow-pohon" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="4.5" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <linearGradient id="grad-dahan" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#050914" />
                        <stop offset="100%" stop-color="#0f172a" />
                    </linearGradient>
                </defs>

                <!-- Dahan Utama & Ranting -->
                <path d="M -30 45 Q 140 35 320 98 Q 385 122 420 150" stroke="url(#grad-dahan)" stroke-width="26" stroke-linecap="round" fill="none" />
                <path d="M 160 55 Q 220 25 290 35" stroke="#080d1e" stroke-width="11" stroke-linecap="round" fill="none" />
                <path d="M -30 45 Q 140 35 320 98" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#glow-pohon)" />
                
                <!-- Sulur Cahaya Menggantung -->
                <line x1="85" y1="48" x2="85" y2="115" stroke="#5eead4" stroke-width="1.2" opacity="0.5" />
                <circle cx="85" cy="118" r="3.5" fill="#5eead4" filter="url(#glow-pohon)" />
                
                <line x1="145" y1="54" x2="145" y2="140" stroke="#f472b6" stroke-width="1.2" opacity="0.5" />
                <circle cx="145" cy="143" r="3.5" fill="#f472b6" filter="url(#glow-pohon)" />

                <line x1="315" y1="98" x2="315" y2="155" stroke="#fde047" stroke-width="1.2" opacity="0.5" />
                <circle cx="315" cy="158" r="3" fill="#fde047" filter="url(#glow-pohon)" />

                <!-- Grup Ayunan + Siluet Orang Duduk -->
                <g class="grup-ayunan">
                    <!-- Tali Kiri & Kanan -->
                    <line x1="215" y1="68" x2="208" y2="255" stroke="#94a3b8" stroke-width="2" opacity="0.85" />
                    <line x1="255" y1="78" x2="248" y2="255" stroke="#94a3b8" stroke-width="2" opacity="0.85" />
                    
                    <!-- Siluet Orang Duduk Santai -->
                    <g class="siluet-orang">
                        <!-- Kaki menjuntai sedikit ke depan -->
                        <path d="M 232 248 L 246 276 L 241 278 L 226 252 Z" fill="#030712" />
                        <path d="M 225 250 L 238 278 L 233 280 L 219 253 Z" fill="#060c1f" />
                        <!-- Badan / Punggung bersandar lembut ke tali -->
                        <path d="M 216 252 C 212 232 214 206 222 194 C 232 194 237 215 235 252 Z" fill="#030712" />
                        <!-- Lengan memegang tali ayunan -->
                        <path d="M 222 204 L 248 214 L 247 219 L 220 211 Z" fill="#030712" />
                        <!-- Kepala menengadah sedikit melihat bulan -->
                        <circle cx="225" cy="181" r="10.5" fill="#030712" />
                        <!-- Siluet Rambut / Syal tertiup angin pelan -->
                        <path d="M 216 177 Q 204 186 200 198 Q 210 194 217 186 Z" fill="#030712" />
                        <!-- Rim Light (Garis Cahaya Bulan tipis pada siluet orang) -->
                        <path d="M 229 172 A 10.5 10.5 0 0 1 234 186" stroke="#5eead4" stroke-width="1.2" fill="none" opacity="0.65" />
                        <path d="M 228 196 Q 236 220 235 248" stroke="#5eead4" stroke-width="1" fill="none" opacity="0.45" />
                    </g>

                    <!-- Papan Duduk Ayunan -->
                    <rect x="200" y="253" width="58" height="9" rx="4.5" fill="#1e293b" stroke="#5eead4" stroke-width="1.2" />
                </g>
            </svg>
        </div>

        <!-- Taman Bunga Cahaya & Rumput -->
        <div id="taman-bunga"></div>
        <div id="rumput-container"></div>

        <!-- Danau Refleksi Air di Bawah -->
        <div class="danau-refleksi">
            <div class="pantulan-bulan"></div>
            <div class="riak-air r1"></div>
            <div class="riak-air r2"></div>
            <div class="riak-air r3"></div>
        </div>

        <!-- Toolbar Interaksi Bawah -->
        <div class="toolbar-interaksi">
            <button class="btn-mode aktif" data-mode="bunga">Tanam Bunga 🌸</button>
            <button class="btn-mode" data-mode="lentera">Lepas Lentera 🏮</button>
            <button class="btn-mode" data-mode="bintang">Bintang Jatuh 🌠</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
