<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctuary Malam — Ruang Jeda & Bintang ✨🌙</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Kanvas Utama: Bintang, Bintang Jatuh, Rasi Bintang & Kunang-kunang -->
    <canvas id="canvas-semesta"></canvas>

    <!-- Lapisan Atmosfer Langit & Aurora -->
    <div class="langit-malam"></div>
    <div class="aurora-layer"></div>
    <div class="kabut-malam"></div>

    <!-- Kontrol Audio Mengambang -->
    <button id="btn-audio-toggle" class="btn-kontrol-mengambang tersembunyi" title="Suara Ambient">
        🔊 <span id="status-audio-teks">Musik Lembut</span>
    </button>

    <!-- =====================================================================
         BABAK 1: PROLOG AMPLOP 3D TILT & PERSONALISASI NAMA
         ===================================================================== -->
    <section id="babak-pembuka" class="layar-babak aktif">
        <div class="wadah-pembuka-animasi" id="tilt-container">
            <div class="cahaya-belakang-amplop"></div>
            <div class="kartu-amplop-3d" id="amplop-interaktif">
                <div class="segel-lilin">✨</div>
                <span class="subjudul-kecil">UNDANGAN MALAM INI</span>
                <h2>Sebuah Ruang Tenang Untukmu</h2>
                <p>Sebelum masuk, tuliskan nama panggilanmu agar semesta malam ini menyapamu dengan hangat.</p>
                
                <div class="grup-input-nama">
                    <input type="text" id="input-nama-user" placeholder="Ketik namamu di sini..." maxlength="20" autocomplete="off">
                </div>

                <button id="btn-buka-surat" class="btn-buka-surat">
                    Buka Ruang Tenang ✨
                </button>
            </div>
        </div>
    </section>

    <!-- =====================================================================
         BABAK 2: 5 KARTU MOTIVASI + FITUR LENTERA & NAPAS INTERAKTIF
         ===================================================================== -->
    <section id="babak-motivasi" class="layar-babak tersembunyi">
        <div class="container-kartu-motivasi">
            <div class="header-motivasi">
                <span class="badge-babak" id="sapaan-personal">✨ UNTUKMU MALAM INI ✨</span>
                <div class="indikator-progres" id="indikator-progres"></div>
            </div>

            <!-- Kartu Utama -->
            <div class="kartu-kaca-animasi" id="kartu-aktif">
                <div class="nomor-kutipan" id="nomor-kutipan">01 / 05</div>
                <h2 class="judul-kutipan" id="judul-kutipan">Kamu Sudah Berjuang Hebat</h2>
                
                <div id="konten-dinamis-kartu">
                    <p class="isi-kutipan" id="isi-kutipan"></p>
                </div>

                <!-- Fitur 1: Lentera Pelepasan Beban (Muncul di langkah ke-4) -->
                <div id="fitur-lentera" class="area-interaktif-kartu tersembunyi">
                    <input type="text" id="input-beban" placeholder="Tulis satu hal yang bikin capek hari ini..." maxlength="60">
                    <button id="btn-terbangkan-lentera" class="btn-sekunder">Terbangkan Jadi Lentera 🏮</button>
                    <p id="status-lentera" class="teks-petunjuk-kecil"></p>
                </div>

                <!-- Fitur 2: Pemandu Napas 4-4-4 (Muncul di langkah ke-2) -->
                <div id="fitur-napas" class="area-interaktif-kartu tersembunyi">
                    <div class="wadah-lingkaran-napas">
                        <div class="lingkaran-napas" id="lingkaran-napas">
                            <span id="teks-napas">Mulai Napas</span>
                        </div>
                    </div>
                    <button id="btn-mulai-napas" class="btn-sekunder">Mulai Relaksasi 15 Detik 🌬️</button>
                </div>

                <div class="hiasan-garis"></div>
            </div>

            <div class="navigasi-motivasi">
                <button id="btn-lanjut-motivasi" class="btn-utama">
                    Lanjut Membaca ➔
                </button>
                <button id="btn-menuju-ending" class="btn-spesial tersembunyi">
                    Masuk ke Ruang Tenang ✨
                </button>
            </div>
        </div>
    </section>

    <!-- =====================================================================
         BABAK 3: TAMAN MALAM, DANAU REFLEKSI & MODE INTERAKSI
         ===================================================================== -->
    <section id="babak-ending" class="layar-babak tersembunyi">
        <!-- Bulan Purnama Interaktif -->
        <div class="bulan-purnama" id="bulan-interaktif" title="Klik Bulan untuk Hujan Bintang">
            <div class="kawah-bulan k1"></div>
            <div class="kawah-bulan k2"></div>
            <div class="kawah-bulan k3"></div>
        </div>

        <!-- Lentera Pelepasan Beban yang Melayang ke Langit -->
        <div id="langit-lentera"></div>

        <!-- Siluet Gunung Berlapis -->
        <div class="pemandangan-gunung">
            <svg class="svg-gunung" viewBox="0 0 1200 400" preserveAspectRatio="none">
                <path d="M0 350 L200 170 L450 290 L750 110 L1000 260 L1200 180 L1200 400 L0 400 Z" fill="#040b1e" opacity="0.8"/>
                <path d="M0 380 L160 240 L420 330 L720 180 L980 310 L1200 240 L1200 400 L0 400 Z" fill="#020617"/>
            </svg>
        </div>

        <!-- Bingkai Pesan Puitis di Atas -->
        <div id="lirik-container">
            <div class="bingkai-lirik">
                <span class="bintang-lirik">✦</span>
                <p id="teks-lirik">Selamat datang di ruang tenangmu...</p>
                <span class="bintang-lirik">✦</span>
            </div>
        </div>

        <!-- Panggung Ayunan di Samping Kiri -->
        <div class="panggung-ayunan-samping">
            <svg class="svg-ayunan-samping" viewBox="0 0 400 400">
                <defs>
                    <filter id="glow-pohon" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <path d="M -20 50 Q 150 40 310 95 Q 380 120 410 145" stroke="#090f24" stroke-width="24" stroke-linecap="round" fill="none" />
                <path d="M -20 50 Q 150 40 310 95" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.45" filter="url(#glow-pohon)" />
                
                <line x1="90" y1="52" x2="90" y2="115" stroke="#5eead4" stroke-width="1" opacity="0.4" />
                <circle cx="90" cy="118" r="3" fill="#5eead4" filter="url(#glow-pohon)" />
                <line x1="150" y1="58" x2="150" y2="135" stroke="#f472b6" stroke-width="1" opacity="0.4" />
                <circle cx="150" cy="138" r="3" fill="#f472b6" filter="url(#glow-pohon)" />

                <g class="grup-ayunan">
                    <line x1="220" y1="72" x2="215" y2="245" stroke="#94a3b8" stroke-width="1.8" opacity="0.85" />
                    <line x1="250" y1="82" x2="245" y2="245" stroke="#94a3b8" stroke-width="1.8" opacity="0.85" />
                    <rect x="208" y="245" width="48" height="6" rx="3" fill="#5eead4" filter="url(#glow-pohon)" />

                    <path d="M 236 245 L 252 270 L 247 290" stroke="#020617" stroke-width="7" stroke-linecap="round" fill="none" />
                    <path d="M 229 245 L 243 273 L 239 293" stroke="#0f172a" stroke-width="6" stroke-linecap="round" fill="none" />
                    <path d="M 225 245 Q 218 218 224 196 Q 233 196 237 245 Z" fill="#020617" />
                    <circle cx="230" cy="184" r="10" fill="#020617" />
                    <path d="M 221 180 Q 210 186 205 198 Q 214 196 222 189 Z" fill="#f472b6" opacity="0.9" />
                </g>
            </svg>
        </div>

        <!-- Danau Refleksi di Bawah -->
        <div class="danau-refleksi">
            <div class="pantulan-bulan"></div>
        </div>

        <!-- Taman Bunga Neon & Rumput -->
        <div id="taman-bunga"></div>
        <div id="rumput-container"></div>

        <!-- Toolbar Mode Interaksi di Babak 3 -->
        <div class="toolbar-interaksi">
            <button class="btn-mode aktif" data-mode="bunga">🌸 Tanam Bunga</button>
            <button class="btn-mode" data-mode="bintang">✨ Gambar Rasi Bintang</button>
            <button class="btn-mode" data-mode="lentera">🏮 Lepas Lentera</button>
        </div>

        <button id="btn-ulang-semua" class="btn-ulang-pojok">Ulangi ↻</button>
    </section>

    <!-- Audio Utama (Jika file lagu.mp3 ada, diputar; jika tidak, Synth Piano aktif otomatis) -->
    <audio id="lagu-utama" src="lagu.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
